# Free Supabase projects pause after ~7 days without activity.
# This pings the database twice a week. Add two repository secrets in GitHub:
#   SUPABASE_URL  and  SUPABASE_ANON_KEY   (same values as in your .env)
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * 1,4'   # Monday & Thursday, 08:47 IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
